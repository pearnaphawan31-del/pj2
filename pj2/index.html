<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cloud Goals</title>
    <link rel="stylesheet" href="css/main_page.css">
    <!-- Supabase SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="box1">
            <p>☁️</p>
            <h1>My Savings Cloud</h1>
            <p>Create and manage your dream goals</p>
        </div>

        <div class="box2">
            <h2 class="section-title">Create New Goal</h2>
            <form id="createGoalForm" class="goal-form">
                <div class="input-group">
                    <label>Goal Name</label>
                    <input type="text" id="goalName" placeholder="e.g. New iPhone, Japan Trip" required>
                </div>
                <div class="input-group">
                    <label>Target Amount (฿)</label>
                    <input type="number" id="goalTarget" placeholder="e.g. 12000" min="1" required>
                </div>
                <button type="submit" class="btn-primary">+ Create Cloud Goal</button>
            </form>
        </div>

        <div class="box2">
            <h2 class="section-title">Your Goals</h2>
            <!-- บริเวณนี้จะถูกเรนเดอร์ข้อมูลจาก Supabase โดยอัตโนมัติ -->
            <div id="goalsList" class="goals-grid">
                <p style="text-align: center; color: #38bdf8;">Loading goals...</p>
            </div>
        </div>
    </div>
</body>
</html>
